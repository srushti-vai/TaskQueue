[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskqueue"
version = "0.1.0"
description = "A durable educational background-job queue"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "pydantic>=2.7", "typer>=0.12", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
taskqueue = "taskqueue.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["taskqueue"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

